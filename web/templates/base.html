<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>{% block title %}Transcriber{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><path d='M8 18v-4M12 22V10M16 25V7M20 21v-10M24 17v-2' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=4">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 18v-4M12 22V10M16 25V7M20 21v-10M24 17v-2"/></svg>
      <span>Transcriber</span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Upload</a>
      <a href="{{ url_for('library') }}" class="{% if request.endpoint in ('library', 'job_page') %}active{% endif %}">Library</a>
      <a href="{{ url_for('settings_page') }}" class="{% if request.endpoint == 'settings_page' %}active{% endif %}">Settings</a>
    </nav>
    <span id="health" class="health" title="Checking GPU…"><i></i><span class="health-text">GPU</span></span>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <div id="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='app.js') }}?v=4"></script>
</body>
</html>
